name: 'commodities_dw'
version: '1.0.0'
config-version: 2

# Profile name matching ~/.dbt/profiles.yml
profile: 'commodities_dw'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  commodities_dw:
    +schema: public

models:
  commodities_dw:
    staging:
      +materialized: view
      +schema: staging
    analytics:
      +materialized: table
      +schema: analytics
